<!DOCTYPE html>
<html>
<head>
    <title>Shop 1</title>
    <script type="module" src="./shop1.ts"></script>
    <link rel="stylesheet" href="./shop1.css">
</head>

<body>

    <h1>Buy three items</h1>

    <table>
        <thead>
            <tr>
                <th scope="row">Shopping Cart</th>
            </tr>
            <tr>
                <th>Item</th>
                <th>Unit Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Apple</td>
                <td name="UnitPrice">00.33</td>
                <td name="Quantity">6</td>
            </tr>
                       <tr>
                <td>Grapes</td>
                <td name="UnitPrice">3.00</td>
                <td name="Quantity">1</td>
            </tr>
                       <tr>
                <td>Orange</td>
                <td name="UnitPrice">00.40</td>
                <td name="Quantity">12</td>
            </tr>
        </tbody>
           <tfoot>
                <tr>
                    <td><button id="calculate-total">Sum</button></td>
                    <td>Total</td>
                    <td id="payment">--</td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>Total with 25% Discount</td>
                    <td id="discounted">--</td>
                </tr>
           </tfoot>
    </table>

</body>
</html>
